<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>AI in Banking — Brain Warm-Up</title>

<!-- PWA / iOS "Add to Home Screen" -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI Quiz">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --card-soft: #f1f3f6;
    --accent: #4f46e5;
    --accent-soft: #6366f1;
    --accent-tint: #eef0fe;
    --text: #1f2937;
    --muted: #6b7280;
    --correct: #16a34a;
    --correct-bg: #ecfdf3;
    --correct-border: #86efac;
    --wrong: #dc2626;
    --wrong-bg: #fef2f2;
    --wrong-border: #fca5a5;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: contain; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding:
      calc(40px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(60px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  h1 { font-size: 1.55rem; margin: 0 0 6px; letter-spacing: -0.02em; font-weight: 700; }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin: 0; }
  .date-pill {
    display: inline-block; margin-top: 14px; padding: 5px 15px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    font-size: 0.8rem; color: var(--accent); font-weight: 600;
  }

  #progress {
    display: none; margin: 22px 0 4px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px;
  }
  #progress.show { display: block; }
  #progress h3 { margin: 0 0 12px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .topic-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 0.85rem; }
  .topic-row:last-child { margin-bottom: 0; }
  .topic-name { width: 150px; flex-shrink: 0; color: var(--text); font-weight: 500; }
  .bar { flex: 1; height: 8px; background: var(--card-soft); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
  .topic-pct { width: 76px; flex-shrink: 0; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
  .topic-row.weak .bar > span { background: var(--wrong); }
  .topic-row.strong .bar > span { background: var(--correct); }
  .focus-note { margin-top: 12px; font-size: 0.83rem; color: var(--accent); background: var(--accent-tint); padding: 9px 12px; border-radius: 9px; }

  .controls { text-align: center; margin: 22px 0 28px; }
  button.primary {
    background: var(--accent); color: #fff; border: none; padding: 14px 28px; font-size: 1rem;
    font-weight: 600; border-radius: 12px; cursor: pointer; transition: background .14s ease, transform .12s ease;
  }
  button.primary:active { transform: scale(0.98); background: var(--accent-soft); }
  button.ghost {
    background: var(--card); color: var(--accent); border: 1px solid var(--border);
    padding: 12px 22px; font-size: 0.94rem; font-weight: 600; border-radius: 11px; cursor: pointer; margin: 6px 5px 0;
  }
  button.ghost:active { background: var(--card-soft); }

  .q-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 18px 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .q-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px; }
  .q-num {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent-tint); color: var(--accent); font-weight: 700; font-size: 0.86rem;
    display: flex; align-items: center; justify-content: center;
  }
  .q-text { font-size: 1.02rem; font-weight: 600; color: var(--text); }
  .q-tag {
    font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); font-weight: 700; margin-left: auto; white-space: nowrap;
    background: var(--card-soft); padding: 3px 8px; border-radius: 6px;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  label.opt {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 11px;
    cursor: pointer; transition: border-color .12s ease, background .12s ease;
  }
  label.opt:active { background: var(--accent-tint); }
  label.opt input { accent-color: var(--accent); width: 19px; height: 19px; flex-shrink: 0; }
  .opt-letter { font-weight: 700; color: var(--accent); width: 16px; flex-shrink: 0; text-align: center; }
  label.opt.correct { background: var(--correct-bg); border-color: var(--correct-border); }
  label.opt.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
  label.opt.locked { cursor: default; }
  label.opt.idk { border-style: dashed; color: var(--muted); margin-top: 2px; }
  label.opt.idk .opt-letter { filter: grayscale(0.2); }

  .feedback {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem;
    display: none; background: var(--card-soft); border-left: 3px solid var(--accent);
  }
  .feedback.show { display: block; }
  .feedback .verdict { font-weight: 700; }
  .feedback .verdict.right { color: var(--correct); }
  .feedback .verdict.miss { color: var(--wrong); }
  .feedback .verdict.idk { color: var(--accent); }
  .feedback .ans { color: var(--accent); font-weight: 600; display: block; margin-top: 6px; }
  .feedback .learn {
    display: inline-block; margin-top: 9px; color: var(--accent); font-weight: 600;
    text-decoration: none; font-size: 0.88rem; border-bottom: 1px solid var(--accent-soft); padding-bottom: 1px;
  }
  .feedback .learn:active { opacity: 0.7; }

  #scoreBanner {
    display: none; text-align: center; margin: 24px 0; padding: 22px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  #scoreBanner.show { display: block; }
  #scoreBanner .score { font-size: 1.9rem; font-weight: 800; color: var(--accent); }
  #scoreBanner .msg { color: var(--muted); margin-top: 4px; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 30px; }
  footer a { color: var(--accent); cursor: pointer; text-decoration: none; }

  @media (max-width: 600px) {
    h1 { font-size: 1.4rem; }
    .q-card { padding: 18px 15px 14px; }
    .topic-name { width: 120px; }
    #actionRow.sticky {
      position: sticky; bottom: 0; margin: 8px -8px 0; padding: 12px 8px calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 70%, rgba(246,247,249,0));
    }
    #actionRow.sticky button.primary { width: 100%; }
    #actionRow.sticky button.ghost { width: 100%; margin: 8px 0 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧠 Daily AI in Banking Warm-Up</h1>
    <p class="subtitle">Six questions: fundamentals → AI in banking → governance. A real warm-up — pick "I don't know" any time.</p>
    <div class="date-pill" id="datePill"></div>
  </header>

  <div id="progress">
    <h3>Your progress so far</h3>
    <div id="topicBars"></div>
    <div class="focus-note" id="focusNote"></div>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">Start today's quiz →</button>
  </div>

  <div id="scoreBanner">
    <div class="score" id="scoreText"></div>
    <div class="msg" id="scoreMsg"></div>
  </div>

  <form id="quiz" class="hidden"></form>

  <div class="controls hidden sticky" id="actionRow">
    <button type="button" class="primary" id="submitBtn">Submit answers</button>
    <button type="button" class="ghost" id="newBtn">New questions</button>
  </div>

  <footer>
    Your results are saved privately on this device only.
    <a id="resetLink">Reset my progress</a>
  </footer>
</div>

<script>
/* ============================================================
   QUESTION BANK — 6 areas, 15 questions each, intermediate level.
     1  Fundamentals
     2  ML Basics
     3  AI in Banking · intro
     4  AI in Banking · applied
     5  AI in Banking · advanced
     gov Governance & the EU AI Act
   a = correct index (0=A .. 3=D).
   ============================================================ */
const BANK = {
  1: [
    { id:"e1", q:"Which best distinguishes machine learning from traditional rule-based software?",
      o:["ML never uses program code","The decision logic is inferred from data rather than hand-written by a programmer","ML always needs more memory","ML only works on images"],
      a:1, e:"The defining shift is that ML derives its rules from data, whereas traditional software follows logic a developer wrote explicitly.",
      link:"https://en.wikipedia.org/wiki/Machine_learning" },
    { id:"e2", q:"A model predicts house price from size and location. Size and location are the ___, and price is the ___.",
      o:["labels; feature","features; label (target)","hyperparameters; weight","epochs; loss"],
      a:1, e:"Inputs are features; the value being predicted is the label or target.",
      link:"https://en.wikipedia.org/wiki/Feature_(machine_learning)" },
    { id:"e3", q:"Which of these is NOT a classification problem?",
      o:["Diagnosing a tumour as benign or malignant","Identifying which language a text is written in","Predicting next quarter's revenue in euros","Deciding whether a transaction is fraud or not"],
      a:2, e:"Predicting a continuous euro amount is regression; the others assign a discrete category.",
      link:"https://en.wikipedia.org/wiki/Statistical_classification" },
    { id:"e4", q:"Why are informative features often more important than the choice of algorithm?",
      o:["All algorithms are identical","Features are only used for charts","If the inputs don't carry the relevant signal, no algorithm can learn what isn't there","Algorithms ignore their inputs"],
      a:2, e:"Features set the ceiling on performance — even a powerful algorithm can't extract signal that the data doesn't contain.",
      link:"https://en.wikipedia.org/wiki/Feature_(machine_learning)" },
    { id:"e5", q:"What is the main danger of judging a model only on its training data?",
      o:["It trains too slowly","You can't tell if it merely memorised, since it has already seen those answers","It uses too little memory","The colours look wrong"],
      a:1, e:"Scoring on data the model has seen overstates performance; only unseen data reveals true generalisation.",
      link:"https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets" },
    { id:"e6", q:"Which is the most accurate description of a trained 'model'?",
      o:["The raw dataset","The training algorithm itself","A learned function mapping inputs to outputs, captured in its parameters","A chart of accuracy over time"],
      a:2, e:"A model is the learned input→output mapping, stored in parameters such as weights.",
      link:"https://developers.google.com/machine-learning/glossary#model" },
    { id:"e7", q:"Which scenario is best suited to unsupervised learning?",
      o:["Predicting default from labelled past loans","Segmenting customers into groups when no categories are predefined","Classifying emails using labelled spam examples","Forecasting sales from historical figures"],
      a:1, e:"With no labels and a goal of discovering structure/groups, clustering (unsupervised) fits; the others rely on labelled targets.",
      link:"https://en.wikipedia.org/wiki/Unsupervised_learning" },
    { id:"e8", q:"The phrase 'garbage in, garbage out' in ML emphasises that…",
      o:["Models clean their own data automatically","The quality and relevance of the data limit how good the model can be","Bigger files are always better","Data doesn't matter if the algorithm is strong"],
      a:1, e:"Model quality is bounded by data quality — flawed or biased data produces flawed predictions.",
      link:"https://en.wikipedia.org/wiki/Data_set" },
    { id:"e9", q:"A fraud classifier outputs 0.85 for a transaction. This is most usefully read as…",
      o:["85 separate transactions","An estimated probability/score that the case is fraud","The model's overall accuracy","The learning rate"],
      a:1, e:"Many classifiers emit a probability-like score; 0.85 indicates a high estimated likelihood of the positive class.",
      link:"https://developers.google.com/machine-learning/glossary#prediction" },
    { id:"e10", q:"Which task–type pairing is correct?",
      o:["Estimating customer lifetime value (€) → classification","Flagging a payment as fraud/not → regression","Predicting tomorrow's temperature (°C) → regression","Sorting documents by topic → regression"],
      a:2, e:"Predicting a continuous number (temperature) is regression; assigning categories is classification.",
      link:"https://en.wikipedia.org/wiki/Regression_analysis" },
    { id:"e11", q:"Which nesting of the fields is correct?",
      o:["They are unrelated fields","Deep learning ⊂ machine learning ⊂ artificial intelligence","AI ⊂ deep learning","Machine learning ⊂ deep learning"],
      a:1, e:"Deep learning is a subset of machine learning, which is itself a subset of the broader AI field.",
      link:"https://en.wikipedia.org/wiki/Artificial_intelligence" },
    { id:"e12", q:"What chiefly lets deep neural networks model very complex patterns?",
      o:["They avoid using data","Many layers that build up increasingly abstract representations","They are simple lookup tables","They use no mathematics"],
      a:1, e:"Stacked layers learn hierarchical features (e.g. edges → shapes → objects), enabling rich pattern modelling.",
      link:"https://en.wikipedia.org/wiki/Deep_learning" },
    { id:"e13", q:"In ML, 'inference' specifically refers to…",
      o:["The training process","Using a trained model to produce predictions on new inputs","Cleaning the dataset","Choosing hyperparameters"],
      a:1, e:"Inference is the deployment-time use of a finished model to make predictions.",
      link:"https://developers.google.com/machine-learning/glossary#inference" },
    { id:"e14", q:"A spam filter trained only on 2018 emails works poorly today. The most likely reason is…",
      o:["The computer aged","The patterns of spam changed, so the old model no longer matches reality","The emails were deleted","Accuracy can't exceed 50%"],
      a:1, e:"This is distribution/concept drift: real-world patterns shifted away from the training data, so the model degrades.",
      link:"https://en.wikipedia.org/wiki/Concept_drift" },
    { id:"e15", q:"Which is the clearest sign you have a supervised learning problem?",
      o:["You have inputs paired with known correct outputs to learn from","You have no data at all","You only have unlabelled images","You only care about speed"],
      a:0, e:"Supervised learning requires labelled examples — inputs with their known answers.",
      link:"https://en.wikipedia.org/wiki/Supervised_learning" },
  ],
  2: [
    { id:"m1", q:"Overfitting is best characterised as…",
      o:["High training error and high test error","Low training error but high test error (poor generalisation)","Low error everywhere","Simply slow training"],
      a:1, e:"An overfit model fits the training data very well yet generalises poorly — the train–test gap is the tell.",
      link:"https://en.wikipedia.org/wiki/Overfitting" },
    { id:"m2", q:"Why is accuracy unreliable when only 1% of cases are fraud?",
      o:["Accuracy is hard to compute","Always predicting 'not fraud' scores 99% accuracy while catching zero fraud","Accuracy needs no labels","Fraud can't be measured"],
      a:1, e:"Under heavy imbalance a trivial majority-class predictor looks excellent on accuracy yet is useless — precision/recall matter more.",
      link:"https://en.wikipedia.org/wiki/Accuracy_and_precision" },
    { id:"m3", q:"What is the validation set mainly for?",
      o:["Training the final weights","Tuning hyperparameters and deciding when to stop, without touching the test set","Replacing the test set for final reporting","Storing backups"],
      a:1, e:"Validation guides development choices; the test set stays sealed for one honest, final estimate.",
      link:"https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets" },
    { id:"m4", q:"What is the role of the loss function during training?",
      o:["It measures the model's speed","It quantifies prediction error so the optimiser knows how to adjust the parameters","It counts the layers","It encrypts the model"],
      a:1, e:"The loss turns 'how wrong' into a number the optimiser drives down by changing parameters.",
      link:"https://en.wikipedia.org/wiki/Loss_function" },
    { id:"m5", q:"Which statement about parameters vs hyperparameters is correct?",
      o:["Both are set by hand before training","Parameters are learned from data; hyperparameters are chosen before training","Both are learned automatically","Hyperparameters are learned; parameters are fixed"],
      a:1, e:"The model learns parameters (weights); you choose hyperparameters (learning rate, depth) beforehand.",
      link:"https://en.wikipedia.org/wiki/Hyperparameter_(machine_learning)" },
    { id:"m6", q:"Without a non-linear activation function, a deep stack of layers collapses to…",
      o:["A single linear transformation","A decision tree","A purely random model","An unbeatable model"],
      a:0, e:"Composing linear layers yields another linear function; non-linear activations are what give networks their power.",
      link:"https://en.wikipedia.org/wiki/Activation_function" },
    { id:"m7", q:"A 'weight' in a neural network is…",
      o:["Fixed and never changed","A learned value that scales an input's contribution","The size of the dataset","Chosen randomly and kept forever"],
      a:1, e:"Weights are learned during training and set how strongly each input influences the output.",
      link:"https://developers.google.com/machine-learning/glossary#weight" },
    { id:"m8", q:"Training for far too many epochs tends to…",
      o:["Always improve test accuracy","Risk overfitting as the model starts memorising training noise","Safely drive test error to zero","Have no effect at all"],
      a:1, e:"Past a point, extra epochs fit noise: training error keeps falling while validation error rises. Early stopping helps.",
      link:"https://en.wikipedia.org/wiki/Early_stopping" },
    { id:"m9", q:"The 'generalisation gap' refers to…",
      o:["The time taken to train","The difference between performance on training data and on unseen data","The number of parameters","The model file size"],
      a:1, e:"A large gap (good on train, worse on unseen data) is a hallmark of overfitting.",
      link:"https://developers.google.com/machine-learning/glossary#generalization" },
    { id:"m10", q:"Which is true of a single neural-network neuron?",
      o:["It stores the whole dataset","It computes a weighted sum of its inputs, then applies an activation","It is a physical chip","It can only ever output 0 or 1"],
      a:1, e:"A neuron combines inputs by weights, adds a bias, and passes the result through an activation function.",
      link:"https://en.wikipedia.org/wiki/Artificial_neuron" },
    { id:"m11", q:"How do training and inference differ?",
      o:["Training makes predictions; inference learns","Training adjusts parameters from data; inference applies the fixed model to new inputs","They are identical","Inference always needs labels"],
      a:1, e:"Training learns parameters from data; inference uses the trained model to predict — no labels required.",
      link:"https://developers.google.com/machine-learning/glossary#inference" },
    { id:"m12", q:"Why does supervised learning need labelled data while clustering does not?",
      o:["Clustering predicts known targets","Supervised learning maps inputs to known outputs; clustering only groups by similarity","They both require labels","Neither needs any data"],
      a:1, e:"Supervised learning needs target labels to learn the mapping; clustering finds structure without them.",
      link:"https://en.wikipedia.org/wiki/Labeled_data" },
    { id:"m13", q:"Why is a simple 'baseline' model worth building first?",
      o:["It is the most accurate model possible","It sets a reference a complex model must beat to justify its cost","It removes the need for data","It replaces evaluation"],
      a:1, e:"Baselines are a sanity check: if a fancy model can't beat a simple one, the added complexity isn't earning its keep.",
      link:"https://developers.google.com/machine-learning/glossary#baseline" },
    { id:"m14", q:"Cross-validation improves on a single train/test split by…",
      o:["Making training faster","Averaging results over several rotating splits for a more reliable estimate","Removing the need for data","Guaranteeing zero error"],
      a:1, e:"k-fold cross-validation reduces dependence on one lucky or unlucky split.",
      link:"https://en.wikipedia.org/wiki/Cross-validation_(statistics)" },
    { id:"m15", q:"Regularisation (e.g. penalising large weights) mainly helps by…",
      o:["Speeding up data loading","Discouraging overly complex fits, which reduces overfitting","Adding more features automatically","Increasing the learning rate"],
      a:1, e:"Regularisation constrains model complexity, improving generalisation to new data.",
      link:"https://en.wikipedia.org/wiki/Regularization_(mathematics)" },
  ],
  3: [
    { id:"b1", q:"What is the strongest reason banks use ML rather than only fixed rules for card-fraud detection?",
      o:["ML needs no data","ML can adapt to new, evolving fraud patterns that static rules miss","Rules are illegal","ML removes the need for any human review"],
      a:1, e:"Fraud evolves; learning models adapt to new patterns, whereas hand-written rules quickly go stale.",
      link:"https://en.wikipedia.org/wiki/Data_analysis_techniques_for_fraud_detection" },
    { id:"b2", q:"A modern banking virtual assistant relies most on which AI capability?",
      o:["Optical character recognition","Natural language processing to understand and respond to text or speech","Image generation","Portfolio optimisation"],
      a:1, e:"Conversational assistants depend on NLP to interpret customer questions and respond appropriately.",
      link:"https://en.wikipedia.org/wiki/Chatbot" },
    { id:"b3", q:"A credit scoring model's output is best described as…",
      o:["A guaranteed yes/no with full certainty","An estimated probability or score of repayment that informs the decision","The customer's exact future income","The bank's expected profit"],
      a:1, e:"Scores express estimated risk; the lending decision then applies thresholds and policy on top.",
      link:"https://en.wikipedia.org/wiki/Credit_score" },
    { id:"b4", q:"Automated identity checks at digital onboarding typically combine OCR with…",
      o:["Stress testing","Face matching / biometric verification against the document photo","Algorithmic trading","Churn modelling"],
      a:1, e:"Onboarding reads the document (OCR) and matches the customer's selfie to the ID photo (biometrics) to verify identity.",
      link:"https://en.wikipedia.org/wiki/Know_your_customer" },
    { id:"b5", q:"'Next-best-product' suggestions in a banking app are an application of…",
      o:["Anti-money-laundering","Stress testing","Recommender systems","Optical character recognition"],
      a:2, e:"Recommenders rank products a customer is likely to want, using behavioural and profile data.",
      link:"https://en.wikipedia.org/wiki/Recommender_system" },
    { id:"b6", q:"AML transaction monitoring is hard mainly because…",
      o:["There is no transaction data","Truly suspicious activity is rare and deliberately disguised within huge volumes of normal payments","All transactions look identical","It needs no thresholds"],
      a:1, e:"Launderers hide among vast normal traffic, so systems must catch rare, camouflaged patterns without drowning investigators in false alerts.",
      link:"https://en.wikipedia.org/wiki/Anti%E2%80%93money_laundering" },
    { id:"b7", q:"A very high false-positive rate in AML alerts mainly causes…",
      o:["Lower compliance costs","Investigators overwhelmed by alerts, most of which are not real laundering (alert fatigue)","More laundering automatically","Faster customer onboarding"],
      a:1, e:"Too many false alerts swamp compliance teams — 'alert fatigue' is a well-known AML problem.",
      link:"https://en.wikipedia.org/wiki/Anti%E2%80%93money_laundering" },
    { id:"b8", q:"KYC and AML programmes are driven primarily by…",
      o:["Marketing goals","Legal and regulatory obligations to prevent financial crime","App-design trends","Interest-rate policy"],
      a:1, e:"KYC/AML are regulatory requirements aimed at preventing money laundering and terrorist financing.",
      link:"https://en.wikipedia.org/wiki/Know_your_customer" },
    { id:"b9", q:"An accurate churn model that fires too late is of limited use because…",
      o:["Accuracy is meaningless","Retention works only if at-risk customers are spotted early enough to intervene","Churn can't be predicted at all","It needs no data"],
      a:1, e:"Timeliness matters: a correct prediction only helps if there's still time to act and retain the customer.",
      link:"https://en.wikipedia.org/wiki/Customer_attrition" },
    { id:"b10", q:"Compared with a human advisor, a robo-advisor mainly offers…",
      o:["Higher fees and slower service","Lower-cost, algorithm-driven portfolio management at scale","Guaranteed returns","No need for any risk profiling"],
      a:1, e:"Robo-advisors automate portfolio construction and rebalancing cheaply — though they still assess risk tolerance.",
      link:"https://en.wikipedia.org/wiki/Robo-advisor" },
    { id:"b11", q:"Which feature is both predictive AND acceptable to use in a credit model?",
      o:["The applicant's ethnicity","Their debt-to-income ratio","The applicant's religion","Postcode used as a stand-in for race"],
      a:1, e:"Debt-to-income is relevant and permissible; protected traits — and proxies for them, like postcode for race — are not.",
      link:"https://en.wikipedia.org/wiki/Credit_risk" },

const TAGS = { 1:"Fundamentals", 2:"ML Basics", 3:"Banking AI", 4:"Banking AI", 5:"Banking AI", gov:"Governance" };
const TOPIC_NAMES = { 1:"Fundamentals", 2:"ML Basics", 3:"Banking AI · intro", 4:"Banking AI · applied", 5:"Banking AI · advanced", gov:"Governance & AI Act" };
const TIER_ORDER = [1, 2, 3, 4, 5, 'gov'];

const STORE_KEY = "aimlQuizStats_v2";
function loadStats() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (_) { return {}; } }
function saveStats(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (_) {} }
function blankStats() { return { byId:{}, byTier:{}, recent:[], totalQuizzes:0, totalCorrect:0, totalSeen:0 }; }
let stats = Object.assign(blankStats(), loadStats());

function pickAdaptive(tier) {
  const pool = BANK[tier];
  const weights = pool.map(item => {
    const rec = stats.byId[item.id] || { seen:0, correct:0 };
    let w = 1;
    if (rec.seen === 0) { w += 1.4; }
    else { w += (1 - rec.correct / rec.seen) * 3; }
    if (stats.recent.includes(item.id)) w *= 0.15;
    return w;
  });
  const total = weights.reduce((s, w) => s + w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

let currentQuestions = [];
let answered = false;

/* Shuffle the four options so the correct answer isn't always in the same spot,
   remapping the correct index to its new position. */
function shuffleOptions(item) {
  const idx = item.o.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return { ...item, o: idx.map(i => item.o[i]), a: idx.indexOf(item.a) };
}

function buildQuiz() {
  currentQuestions = TIER_ORDER.map(tier => shuffleOptions({ ...pickAdaptive(tier), tier }));
  answered = false;
  render();
}

function render() {
  const form = document.getElementById('quiz');
  form.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  currentQuestions.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.answer = item.a;
    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<div class="q-num">${qi + 1}</div>
      <div class="q-text">${item.q}</div><div class="q-tag">${TAGS[item.tier]}</div>`;
    card.appendChild(head);
    const opts = document.createElement('div');
    opts.className = 'options';
    item.o.forEach((text, oi) => {
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML = `<input type="radio" name="q${qi}" value="${oi}">
        <span class="opt-letter">${letters[oi]}</span><span>${text}</span>`;
      opts.appendChild(label);
    });
    const idk = document.createElement('label');
    idk.className = 'opt idk';
    idk.innerHTML = `<input type="radio" name="q${qi}" value="idk">
      <span class="opt-letter">🤷</span><span>I don't know — just show me the answer</span>`;
    opts.appendChild(idk);
    card.appendChild(opts);
    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.innerHTML = `<span class="verdict"></span> <span class="explain"></span>
      <span class="ans"></span><a class="learn" target="_blank" rel="noopener noreferrer"></a>`;
    card.appendChild(fb);
    form.appendChild(card);
  });
}

function submit() {
  if (answered) return;
  const letters = ['A', 'B', 'C', 'D'];
  const cards = document.querySelectorAll('.q-card');
  let score = 0;
  cards.forEach((card, qi) => {
    const item = currentQuestions[qi];
    const correct = parseInt(card.dataset.answer, 10);
    const chosen = card.querySelector(`input[name="q${qi}"]:checked`);
    const val = chosen ? chosen.value : null;
    const labels = card.querySelectorAll('label.opt');
    labels.forEach(l => { l.classList.add('locked'); l.querySelector('input').disabled = true; });
    labels[correct].classList.add('correct');

    const fb = card.querySelector('.feedback');
    const verdict = fb.querySelector('.verdict');
    const explain = fb.querySelector('.explain');
    const ans = fb.querySelector('.ans');
    const learn = fb.querySelector('.learn');

    explain.textContent = item.e;
    ans.textContent = `Correct answer: ${letters[correct]}) ${item.o[correct]}`;
    learn.href = item.link;
    learn.textContent = 'Learn more →';

    const gotIt = val !== null && val !== 'idk' && parseInt(val, 10) === correct;
    if (gotIt) {
      score++;
      verdict.textContent = '✓ Correct!';
      verdict.className = 'verdict right';
    } else if (val === 'idk') {
      verdict.textContent = "🤷 No worries — here's the answer:";
      verdict.className = 'verdict idk';
    } else if (val !== null) {
      labels[parseInt(val, 10)].classList.add('wrong');
      verdict.textContent = '✗ Not quite — ';
      verdict.className = 'verdict miss';
    } else {
      verdict.textContent = '— No answer selected. ';
      verdict.className = 'verdict miss';
    }
    fb.classList.add('show');

    const rec = stats.byId[item.id] || { seen:0, correct:0 };
    rec.seen++; if (gotIt) rec.correct++; stats.byId[item.id] = rec;
    const tRec = stats.byTier[item.tier] || { seen:0, correct:0 };
    tRec.seen++; if (gotIt) tRec.correct++; stats.byTier[item.tier] = tRec;
    stats.recent.unshift(item.id);
  });
  stats.recent = stats.recent.slice(0, 14);
  stats.totalQuizzes++; stats.totalCorrect += score; stats.totalSeen += cards.length;
  saveStats(stats);
  answered = true;

  const banner = document.getElementById('scoreBanner');
  const msgs = [
    "Tough set — every explanation you read is real progress. 💪",
    "Nice effort! Tap 'Learn more' on anything you'd like to dig into. 📈",
    "Good going — you're building genuine understanding. 🌱",
    "Solid work! The concepts are clicking. 🚀",
    "Great job — strong grasp on display! 🌟",
    "Excellent work today! 🧠⚡",
    "Perfect score — outstanding! 🏆"
  ];
  document.getElementById('scoreText').textContent = `You scored ${score} / ${cards.length}`;
  document.getElementById('scoreMsg').textContent = msgs[Math.min(score, msgs.length - 1)];
  banner.classList.add('show');
  renderProgress();
  banner.scrollIntoView({ behavior:'smooth', block:'center' });
}

function renderProgress() {
  const panel = document.getElementById('progress');
  const bars = document.getElementById('topicBars');
  if (!stats.totalSeen) { panel.classList.remove('show'); return; }
  bars.innerHTML = '';
  let weakest = null, weakestPct = 101;
  TIER_ORDER.forEach(tier => {
    const t = stats.byTier[tier];
    const row = document.createElement('div');
    row.className = 'topic-row';
    let pctLabel, width = 0;
    if (t && t.seen) {
      const pct = Math.round(100 * t.correct / t.seen);
      width = pct; pctLabel = `${t.correct}/${t.seen} · ${pct}%`;
      if (pct <= 50) row.classList.add('weak'); else if (pct >= 80) row.classList.add('strong');
      if (pct < weakestPct) { weakestPct = pct; weakest = tier; }
    } else { pctLabel = "not seen yet"; }
    row.innerHTML = `<span class="topic-name">${TOPIC_NAMES[tier]}</span>
      <span class="bar"><span style="width:${width}%"></span></span>
      <span class="topic-pct">${pctLabel}</span>`;
    bars.appendChild(row);
  });
  const note = document.getElementById('focusNote');
  note.style.display = 'block';
  if (weakest !== null && weakestPct <= 70) note.textContent = `🎯 Focusing your next quizzes more on: ${TOPIC_NAMES[weakest]}`;
  else note.textContent = `✅ Balanced across topics — keep the streak going! (${stats.totalQuizzes} quizzes done)`;
  panel.classList.add('show');
}

document.getElementById('datePill').textContent =
  new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
renderProgress();

document.getElementById('startBtn').addEventListener('click', () => {
  buildQuiz();
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('actionRow').classList.remove('hidden');
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('scoreBanner').classList.remove('show');
  document.getElementById('quiz').scrollIntoView({ behavior:'smooth', block:'start' });
});
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('newBtn').addEventListener('click', () => {
  document.getElementById('scoreBanner').classList.remove('show');
  buildQuiz();
  window.scrollTo({ top:0, behavior:'smooth' });
});
document.getElementById('resetLink').addEventListener('click', () => {
  if (confirm("Reset all saved progress on this device?")) {
    stats = blankStats(); saveStats(stats);
    renderProgress(); document.getElementById('progress').classList.remove('show');
  }
});

/* register service worker for offline use (ignored when opened as a local file) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
