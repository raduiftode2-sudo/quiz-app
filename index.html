<style>

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: contain; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.55;

  .subtitle { color: var(--muted); font-size: 0.92rem; margin: 0; min-height: 1.2em; }
  .date-pill { display: inline-block; margin-top: 12px; padding: 5px 15px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; font-size: 0.8rem; color: var(--accent); font-weight: 600; }

  .tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 5px; margin-bottom: 18px; }
  .tab { flex: 1; border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 0.85rem; padding: 10px 6px; border-radius: 9px; cursor: pointer; white-space: nowrap; transition: background .14s, color .14s; }

  #progress h3 { margin: 0 0 12px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .topic-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 0.85rem; }
  .topic-row:last-child { margin-bottom: 0; }
  .topic-name { width: 150px; flex-shrink: 0; color: var(--text); font-weight: 500; }
  .bar { flex: 1; height: 8px; background: var(--card-soft); border-radius: 999px; overflow: hidden; }

  .topic-pct { width: 76px; flex-shrink: 0; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
  .topic-row.weak .bar > span { background: var(--wrong); }
  .topic-row.strong .bar > span { background: var(--correct); }
  .focus-note { margin-top: 12px; font-size: 0.83rem; color: var(--accent); background: var(--accent-tint); padding: 9px 12px; border-radius: 9px; }

  .controls { text-align: center; margin: 18px 0 26px; }
  button.primary { background: var(--accent); color: #fff; border: none; padding: 14px 28px; font-size: 1rem; font-weight: 600; border-radius: 12px; cursor: pointer; transition: background .14s, transform .12s; }
  button.primary:active { transform: scale(0.98); background: var(--accent-soft); }
  button.ghost { background: var(--card); color: var(--accent); border: 1px solid var(--border); padding: 12px 22px; font-size: 0.94rem; font-weight: 600; border-radius: 11px; cursor: pointer; margin: 6px 5px 0; }
  button.ghost:active { background: var(--card-soft); }

  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 18px 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
  .q-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px; }
  .q-num { flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; background: var(--accent-tint); color: var(--accent); font-weight: 700; font-size: 0.86rem; display: flex; align-items: center; justify-content: center; }
  .q-text { font-size: 1.02rem; font-weight: 600; color: var(--text); }
  .q-tag { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin-left: auto; white-space: nowrap; background: var(--card-soft); padding: 3px 8px; border-radius: 6px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  label.opt { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: var(--card); border: 1.5px solid var(--border); border-radius: 11px; cursor: pointer; transition: border-color .12s, background .12s; }
  label.opt:active { background: var(--accent-tint); }
  label.opt input { accent-color: var(--accent); width: 19px; height: 19px; flex-shrink: 0; }
  .opt-letter { font-weight: 700; color: var(--accent); width: 16px; flex-shrink: 0; text-align: center; }
  label.opt.correct { background: var(--correct-bg); border-color: var(--correct-border); }
  label.opt.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
  label.opt.locked { cursor: default; }
  label.opt.idk { border-style: dashed; color: var(--muted); margin-top: 2px; }

  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; display: none; background: var(--card-soft); border-left: 3px solid var(--accent); }
  .feedback.show { display: block; }
  .feedback .verdict { font-weight: 700; }
  .feedback .verdict.right { color: var(--correct); }
  .feedback .verdict.miss { color: var(--wrong); }
  .feedback .verdict.idk { color: var(--accent); }
  .feedback .ans { color: var(--accent); font-weight: 600; display: block; margin-top: 6px; }
  .feedback .learn { display: inline-block; margin-top: 9px; color: var(--accent); font-weight: 600; text-decoration: none; font-size: 0.88rem; border-bottom: 1px solid var(--accent-soft); padding-bottom: 1px; }
  .feedback .learn:active { opacity: 0.7; }

  #scoreBanner { display: none; text-align: center; margin: 24px 0; padding: 22px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
  #scoreBanner.show { display: block; }
  #scoreBanner .score { font-size: 1.9rem; font-weight: 800; color: var(--accent); }
  #scoreBanner .msg { color: var(--muted); margin-top: 4px; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 30px; }
  footer a { color: var(--accent); cursor: pointer; text-decoration: none; }

  @media (max-width: 600px) {
    h1 { font-size: 1.35rem; }
    .tab { font-size: 0.74rem; padding: 9px 2px; }
    .q-card { padding: 18px 15px 14px; }
    .topic-name { width: 120px; }
    #actionRow.sticky { position: sticky; bottom: 0; margin: 8px -8px 0; padding: 12px 8px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(246,247,249,0)); }
    #actionRow.sticky button.primary { width: 100%; }
    #actionRow.sticky button.ghost { width: 100%; margin: 8px 0 0; }
  }
</style>

<script>
/* ===========================================================================
   QUIZ 1 — AI & BANKING  (6 areas, 20 questions each, intermediate level)
   Areas: 1 ML & DS Foundations · 2 Training & Optimization ·
          3 Evaluation & Statistics · 4 Banking applied ·
          5 Banking advanced (MLOps & risk) · 6 Governance & EU AI Act
   a = correct index (0=A..3=D). Options are shuffled at runtime.
   =========================================================================== */
const BANKING = {
  1: [
    { id:"f1", q:"The 'bias–variance trade-off' is essentially the balance between a model that is…", o:["Fast vs slow to train","Too simple (misses real patterns) vs too complex (chases noise)","Large vs small on disk","Supervised vs unsupervised"], a:1, e:"It is the balance between underfitting (too simple) and overfitting (too complex).", link:"https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff" },
    { id:"f2", q:"A model is overfitting. Which is most likely to help?", o:["Train far longer on the same small dataset","Get more varied training data, or use a simpler model","Remove the test set","Add many more layers"], a:1, e:"More varied data or a simpler model helps it generalise instead of memorising.", link:"https://en.wikipedia.org/wiki/Overfitting" },
    { id:"f3", q:"Which scenario is best suited to unsupervised learning?", o:["Predicting default from labelled past loans","Grouping customers into segments when no categories are predefined","Classifying emails using labelled spam examples","Forecasting sales from historical figures"], a:1, e:"With no labels and a goal of finding structure, clustering (unsupervised) fits.", link:"https://en.wikipedia.org/wiki/Unsupervised_learning" },
    { id:"f4", q:"Which task is a regression problem?", o:["Flagging a payment as fraud or not","Predicting a customer's lifetime value in euros","Tagging a document's language","Deciding if a review is positive"], a:1, e:"Predicting a continuous euro amount is regression; the rest are classification.", link:"https://en.wikipedia.org/wiki/Regression_analysis" },
    { id:"f5", q:"Why are informative features often more important than the choice of algorithm?", o:["All algorithms are identical","If the inputs lack the relevant signal, no algorithm can recover it","Features only affect charts","Algorithms ignore their inputs"], a:1, e:"Features set the ceiling — no model can learn signal that is not in the data.", link:"https://en.wikipedia.org/wiki/Feature_(machine_learning)" },
    { id:"f6", q:"'Generalisation' refers to a model that…", o:["Memorises the training data","Performs well on new, unseen data","Trains quickly","Uses little memory"], a:1, e:"Generalisation — doing well on fresh data — is the real goal of ML.", link:"https://developers.google.com/machine-learning/glossary#generalization" },
    { id:"f7", q:"Why hold out a separate test set?", o:["To speed up training","To estimate performance on data the model has never seen","To save disk space","To make nicer charts"], a:1, e:"A held-out set gives an honest read on real-world performance.", link:"https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets" },
    { id:"f8", q:"The validation set is mainly used to…", o:["Train the final weights","Guide development choices without touching the test set","Replace the test set for final reporting","Store backups"], a:1, e:"Validation tunes choices during development; the test set stays sealed for the final check.", link:"https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets" },
    { id:"f9", q:"A model finds that two variables move together. What can you NOT conclude?", o:["That they are associated","That one definitely causes the other","That a relationship exists in the data","That they correlate"], a:1, e:"Correlation shows association, not that one variable causes the other.", link:"https://en.wikipedia.org/wiki/Correlation_does_not_imply_causation" },
    { id:"f10", q:"Why does representative training data matter for fairness?", o:["Any data works equally well","Biased or unrepresentative data can make the model unfair or inaccurate","Data only affects file size","It just changes the colours"], a:1, e:"Models learn from their data; skewed data yields skewed, potentially unfair predictions.", link:"https://en.wikipedia.org/wiki/Sampling_bias" },
    { id:"f11", q:"A 'clustering' algorithm…", o:["Predicts exact numbers","Groups similar items together without predefined labels","Labels data by hand","Encrypts the dataset"], a:1, e:"Clustering is unsupervised grouping by similarity.", link:"https://en.wikipedia.org/wiki/Cluster_analysis" },
    { id:"f12", q:"'Deep learning' refers to…", o:["Learning while a computer is idle","Machine learning using neural networks with many layers","A data backup method","A spreadsheet feature"], a:1, e:"Deep learning stacks many layers to learn complex patterns.", link:"https://en.wikipedia.org/wiki/Deep_learning" },
    { id:"f13", q:"Which is true of a single neural-network neuron?", o:["It stores the whole dataset","It computes a weighted sum of its inputs, then applies an activation","It is a physical chip","It can only output 0 or 1"], a:1, e:"A neuron combines weighted inputs and passes the result through an activation function.", link:"https://en.wikipedia.org/wiki/Artificial_neuron" },
    { id:"f14", q:"'Embeddings' are…", o:["Images pasted into a document","Numeric vectors representing words or items so similar ones sit close together","Hidden viruses","Comments in code"], a:1, e:"Embeddings place items in a vector space where closeness means similarity — powering search and recommendations.", link:"https://en.wikipedia.org/wiki/Word_embedding" },
    { id:"f15", q:"'Reinforcement learning' trains an agent by…", o:["Showing it labelled examples","Trial and error using rewards and penalties","Copying a spreadsheet","Reading a manual once"], a:1, e:"RL learns from rewards and penalties for its actions — used in games and robotics.", link:"https://en.wikipedia.org/wiki/Reinforcement_learning" },
    { id:"f16", q:"'Feature engineering' means…", o:["Building computer hardware","Creating better inputs (e.g. deriving age from a birth date) to help the model","Deleting the model","Hiring more engineers"], a:1, e:"Feature engineering crafts informative inputs, often boosting performance.", link:"https://en.wikipedia.org/wiki/Feature_engineering" },
    { id:"f17", q:"Why is 'label noise' a problem?", o:["It makes computers loud","Wrong or inconsistent labels teach the model the wrong patterns","It adds too many features","It is a type of chart"], a:1, e:"Errors in the labels mislead supervised learning.", link:"https://en.wikipedia.org/wiki/Labeled_data" },
    { id:"f18", q:"Adding many more features is not always better because…", o:["More features always help","Irrelevant ones add noise and can worsen overfitting unless you have much more data","Features never matter","It only changes the colours"], a:1, e:"Irrelevant features add noise; fewer, well-chosen features often win.", link:"https://en.wikipedia.org/wiki/Feature_(machine_learning)" },
    { id:"f19", q:"Which is the most accurate description of a trained 'model'?", o:["The raw dataset","A learned function mapping inputs to outputs, stored in its parameters","The training algorithm itself","A chart of accuracy"], a:1, e:"A model is the learned input-to-output mapping captured in parameters such as weights.", link:"https://developers.google.com/machine-learning/glossary#model" },
    { id:"f20", q:"What distinguishes structured from unstructured data?", o:["They are identical","Structured fits neat tables/columns; unstructured is text, images, or audio","Unstructured data cannot be used","Structured data is always text"], a:1, e:"Structured data fits rows and columns; unstructured data (text, images) needs different handling.", link:"https://en.wikipedia.org/wiki/Unstructured_data" },
  ],
  2: [
    { id:"t1", q:"If the learning rate is set too high, training will typically…", o:["Be slow but very precise","Overshoot and fail to settle (it may diverge)","Ignore the data","Always find the best answer"], a:1, e:"Too large a step overshoots the minimum and can diverge.", link:"https://en.wikipedia.org/wiki/Learning_rate" },
    { id:"t2", q:"The main point of regularization is to…", o:["Speed up data loading","Discourage overly complex models, reducing overfitting","Add features automatically","Encrypt the model"], a:1, e:"Regularization constrains complexity so the model generalises better.", link:"https://en.wikipedia.org/wiki/Regularization_(mathematics)" },
    { id:"t3", q:"A loss function during training…", o:["Measures the model's speed","Quantifies prediction error so the optimiser can reduce it","Counts the layers","Encrypts the output"], a:1, e:"The loss turns 'how wrong' into a number the optimiser drives down.", link:"https://en.wikipedia.org/wiki/Loss_function" },
    { id:"t4", q:"'Gradient descent' is…", o:["A way to delete bad data","A method that nudges the model step by step to lower its error","A chart type","A network cable"], a:1, e:"Like walking downhill, it repeatedly adjusts the model toward lower error.", link:"https://en.wikipedia.org/wiki/Gradient_descent" },
    { id:"t5", q:"Which statement about parameters vs hyperparameters is correct?", o:["Both are set by hand before training","Parameters are learned from data; hyperparameters are chosen before training","Both are learned automatically","Hyperparameters are learned; parameters are fixed"], a:1, e:"The model learns parameters (weights); you choose hyperparameters (learning rate, depth) beforehand.", link:"https://en.wikipedia.org/wiki/Hyperparameter_(machine_learning)" },
    { id:"t6", q:"A 'weight' in a neural network is…", o:["Fixed and never changed","A learned value that scales an input's contribution","The size of the dataset","Chosen at random and kept"], a:1, e:"Weights are learned during training and set how strongly each input matters.", link:"https://developers.google.com/machine-learning/glossary#weight" },
    { id:"t7", q:"Why are non-linear activation functions needed?", o:["Without them, a stack of layers collapses to a single linear function","They speed up disk access","They encrypt the weights","They delete neurons"], a:0, e:"Non-linear activations give networks the power to model complex, non-linear patterns.", link:"https://en.wikipedia.org/wiki/Activation_function" },
    { id:"t8", q:"Training for far too many epochs tends to…", o:["Always improve test accuracy","Risk overfitting as the model memorises training noise","Drive test error safely to zero","Have no effect"], a:1, e:"Past a point, extra epochs fit noise; early stopping helps.", link:"https://en.wikipedia.org/wiki/Early_stopping" },
    { id:"t9", q:"'Dropout' during training…", o:["Deletes bad data","Randomly switches off neurons to reduce overfitting","Speeds up matrix maths","Raises the learning rate over time"], a:1, e:"Dropout randomly disables units so the network can not over-rely on any one, improving generalisation.", link:"https://en.wikipedia.org/wiki/Regularization_(mathematics)" },
    { id:"t10", q:"Why scale or normalise features?", o:["To make files smaller","To put features with very different ranges (age vs income) on comparable footing","To change colours","To delete duplicates"], a:1, e:"Scaling stops large-range features from dominating, helping the model learn.", link:"https://en.wikipedia.org/wiki/Feature_scaling" },
    { id:"t11", q:"In a neural network, 'backpropagation'…", o:["Backs up your files","Works out how much each weight contributed to the error so weights can be adjusted","Reverses the dataset","Uploads data to the cloud"], a:1, e:"Backprop traces error back through the network to update each weight — how neural nets learn.", link:"https://en.wikipedia.org/wiki/Backpropagation" },
    { id:"t12", q:"Why use 'one-hot encoding'?", o:["To make text bold","To turn categories (e.g. red/green/blue) into numeric columns a model can use","To heat up the GPU","To compress images"], a:1, e:"Models need numbers; one-hot represents each category as a column of 0s with a single 1.", link:"https://en.wikipedia.org/wiki/One-hot" },
    { id:"t13", q:"A 'batch' in training is…", o:["A dessert","A group of examples processed together in one update step","A single neuron","A type of chart"], a:1, e:"Models usually update on mini-batches of examples rather than one at a time.", link:"https://developers.google.com/machine-learning/glossary#batch" },
    { id:"t14", q:"The optimiser's job is to…", o:["Draw the charts","Adjust the parameters to lower the loss","Label the data","Choose the colours"], a:1, e:"Optimisers (SGD, Adam, …) update parameters to minimise the loss.", link:"https://en.wikipedia.org/wiki/Gradient_descent" },
    { id:"t15", q:"'Data augmentation' means…", o:["Buying more servers","Creating extra training examples by transforming existing ones (e.g. rotating images)","Deleting duplicates","Adding chart colours"], a:1, e:"Augmentation expands data with realistic variations, improving robustness.", link:"https://en.wikipedia.org/wiki/Data_augmentation" },
    { id:"t16", q:"'Underfitting' means the model is…", o:["Too complex","Too simple to capture the real pattern","Perfectly generalised","Suffering a data breach"], a:1, e:"Underfitting is too-simple; overfitting is the opposite extreme.", link:"https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff" },
    { id:"t17", q:"Why shuffle the training data?", o:["To lose some of it","To avoid the model learning spurious patterns from the data's order","To encrypt it","To slow training down"], a:1, e:"Shuffling breaks accidental ordering so each batch is representative.", link:"https://en.wikipedia.org/wiki/Stochastic_gradient_descent" },
    { id:"t18", q:"'Transfer learning' is…", o:["Moving files between computers","Reusing a model pretrained on a big task as a starting point for your own","Translating data","Transferring money"], a:1, e:"You start from a powerful pretrained model and fine-tune on your smaller dataset.", link:"https://en.wikipedia.org/wiki/Transfer_learning" },
    { id:"t19", q:"Which is a sign training is going well?", o:["Training loss steadily rises","Both training and validation loss decrease together","Validation loss explodes immediately","Nothing changes at all"], a:1, e:"Falling training AND validation loss means the model is learning and generalising.", link:"https://en.wikipedia.org/wiki/Loss_function" },
    { id:"t20", q:"'Early stopping' means…", o:["Powering off the computer","Halting training once validation performance stops improving","Stopping before any data is collected","Ending the project early"], a:1, e:"It stops training at the point of best validation performance, curbing overfitting.", link:"https://en.wikipedia.org/wiki/Early_stopping" },
  ],
  3: [
    { id:"v1", q:"Cross-validation is preferred over a single train/test split because it…", o:["Trains the model faster","Gives a more reliable estimate by testing over several rotating splits","Removes the need for test data","Guarantees zero error"], a:1, e:"k-fold cross-validation reduces dependence on one lucky or unlucky split.", link:"https://en.wikipedia.org/wiki/Cross-validation_(statistics)" },
    { id:"v2", q:"Only 2% of transactions are fraud. Why is '98% accuracy' unimpressive?", o:["Accuracy is hard to compute","Always guessing 'not fraud' already scores 98% while catching no fraud","Fraud can not be measured","Accuracy needs no labels"], a:1, e:"Under heavy imbalance, accuracy is dominated by the majority class.", link:"https://en.wikipedia.org/wiki/Accuracy_and_precision" },
    { id:"v3", q:"What is the difference between precision and recall?", o:["They mean the same thing","Precision = how many flagged were right; recall = how many real ones we caught","Precision is for images, recall for text","Both measure speed"], a:1, e:"Precision is purity of the alerts; recall is coverage of the real positives.", link:"https://en.wikipedia.org/wiki/Precision_and_recall" },
    { id:"v4", q:"A 'confusion matrix' shows…", o:["How confused users are","A table of correct vs incorrect predictions for each category","Training speed","Model file size"], a:1, e:"It lays out true/false positives and negatives — a clear view of the mistakes made.", link:"https://en.wikipedia.org/wiki/Confusion_matrix" },
    { id:"v5", q:"A 'false positive' is…", o:["A missed real case","Flagging something that is actually negative","A correct alert","A duplicate record"], a:1, e:"A false positive is a wrong 'yes'.", link:"https://en.wikipedia.org/wiki/False_positives_and_false_negatives" },
    { id:"v6", q:"A 'false negative' is…", o:["A blocked genuine case","Missing a real positive so it slips through","A correct rejection","A duplicate record"], a:1, e:"A false negative is a missed true case.", link:"https://en.wikipedia.org/wiki/False_positives_and_false_negatives" },

/* ===========================================================================
   QUIZ CONFIG + ENGINE
   =========================================================================== */
const QUIZZES = {
  banking: { tab:"banking", desc:"Six questions: ML & data science, AI in banking, then governance.", mode:"areas",
    order:[1,2,3,4,5,'gov'],
    tags:{1:"Foundations",2:"Training",3:"Evaluation",4:"Banking · applied",5:"Banking · advanced",gov:"Governance"},
    topics:{1:"ML & DS Foundations",2:"Training & Optimization",3:"Evaluation & Statistics",4:"Banking · applied",5:"Banking · advanced",gov:"Governance & AI Act"},
    bank:BANKING },
  claude: { tab:"claude", desc:"Test your knowledge of Claude's features for personal use.", mode:"pool", perRound:6, tagLabel:"Claude", topicName:"Claude features", bank:CLAUDE },
  gemini: { tab:"gemini", desc:"Gemini Enterprise Standard licence features for bank use.", mode:"pool", perRound:6, tagLabel:"Gemini Ent.", topicName:"Gemini Enterprise", bank:GEMINI },
};

const STORE_KEY = "aiQuizState_v3";
function blank() { return { byId:{}, byTier:{}, recent:[], totalQuizzes:0, totalCorrect:0, totalSeen:0 }; }
let state = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (_) { return {}; } })();
Object.keys(QUIZZES).forEach(k => { state[k] = Object.assign(blank(), state[k] || {}); });
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (_) {} }

let activeQuiz = "banking";
let currentQuestions = [];
let answered = false;
const S = () => state[activeQuiz];

function pickFromPool(pool, st, exclude) {
  const weights = pool.map(item => {
    if (exclude && exclude.has(item.id)) return 0;
    const rec = st.byId[item.id] || { seen:0, correct:0 };
    let w = 1;
    if (rec.seen === 0) w += 1.4; else w += (1 - rec.correct / rec.seen) * 3;
    if (st.recent.includes(item.id)) w *= 0.15;
    return w;
  });
  const total = weights.reduce((s, w) => s + w, 0);
  if (total <= 0) {
    const avail = pool.filter(p => !exclude || !exclude.has(p.id));
    return avail[Math.floor(Math.random() * avail.length)] || pool[0];
  }
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function shuffleOptions(item) {
  const idx = item.o.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return { ...item, o: idx.map(i => item.o[i]), a: idx.indexOf(item.a) };
}

function buildQuiz() {
  const quiz = QUIZZES[activeQuiz], st = S();
  let qs;
  if (quiz.mode === "areas") {
    qs = quiz.order.map(area => {
      const it = pickFromPool(quiz.bank[area], st, null);
      return { ...it, tier: area, _tag: quiz.tags[area] };
    });
  } else {
    qs = [];
    const chosen = new Set();
    const n = Math.min(quiz.perRound, quiz.bank.length);
    for (let i = 0; i < n; i++) {
      const it = pickFromPool(quiz.bank, st, chosen);
      chosen.add(it.id);
      qs.push({ ...it, tier: activeQuiz, _tag: quiz.tagLabel });
    }
  }
  currentQuestions = qs.map(shuffleOptions);
  answered = false;
  render();
}

function render() {
  const form = document.getElementById('quiz');
  form.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  currentQuestions.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.answer = item.a;
    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<div class="q-num">${qi + 1}</div><div class="q-text">${item.q}</div><div class="q-tag">${item._tag}</div>`;
    card.appendChild(head);
    const opts = document.createElement('div');
    opts.className = 'options';
    item.o.forEach((text, oi) => {
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML = `<input type="radio" name="q${qi}" value="${oi}"><span class="opt-letter">${letters[oi]}</span><span>${text}</span>`;
      opts.appendChild(label);
    });
    const idk = document.createElement('label');
    idk.className = 'opt idk';
    idk.innerHTML = `<input type="radio" name="q${qi}" value="idk"><span class="opt-letter">🤷</span><span>I don't know — just show me the answer</span>`;
    opts.appendChild(idk);
    card.appendChild(opts);
    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.innerHTML = `<span class="verdict"></span> <span class="explain"></span><span class="ans"></span><a class="learn" target="_blank" rel="noopener noreferrer"></a>`;
    card.appendChild(fb);
    form.appendChild(card);
  });
}

function submit() {
  if (answered) return;
  const letters = ['A', 'B', 'C', 'D'];
  const st = S();
  const cards = document.querySelectorAll('.q-card');
  let score = 0;
  cards.forEach((card, qi) => {
    const item = currentQuestions[qi];
    const correct = parseInt(card.dataset.answer, 10);
    const chosen = card.querySelector(`input[name="q${qi}"]:checked`);
    const val = chosen ? chosen.value : null;
    const labels = card.querySelectorAll('label.opt');
    labels.forEach(l => { l.classList.add('locked'); l.querySelector('input').disabled = true; });
    labels[correct].classList.add('correct');
    const fb = card.querySelector('.feedback');
    const verdict = fb.querySelector('.verdict');
    fb.querySelector('.explain').textContent = item.e;
    fb.querySelector('.ans').textContent = `Correct answer: ${letters[correct]}) ${item.o[correct]}`;
    const learn = fb.querySelector('.learn');
    learn.href = item.link; learn.textContent = 'Learn more →';
    const gotIt = val !== null && val !== 'idk' && parseInt(val, 10) === correct;
    if (gotIt) { score++; verdict.textContent = '✓ Correct!'; verdict.className = 'verdict right'; }
    else if (val === 'idk') { verdict.textContent = "🤷 No worries — here's the answer:"; verdict.className = 'verdict idk'; }
    else if (val !== null) { labels[parseInt(val, 10)].classList.add('wrong'); verdict.textContent = '✗ Not quite — '; verdict.className = 'verdict miss'; }
    else { verdict.textContent = '— No answer selected. '; verdict.className = 'verdict miss'; }
    fb.classList.add('show');
    const rec = st.byId[item.id] || { seen:0, correct:0 };
    rec.seen++; if (gotIt) rec.correct++; st.byId[item.id] = rec;
    const tRec = st.byTier[item.tier] || { seen:0, correct:0 };
    tRec.seen++; if (gotIt) tRec.correct++; st.byTier[item.tier] = tRec;
    st.recent.unshift(item.id);
  });
  st.recent = st.recent.slice(0, 16);
  st.totalQuizzes++; st.totalCorrect += score; st.totalSeen += cards.length;
  save();
  answered = true;

  const banner = document.getElementById('scoreBanner');
  const msgs = [
    "Tough set — every explanation you read is real progress. 💪",
    "Nice effort! Tap 'Learn more' on anything you'd like to dig into. 📈",
    "Good going — you're building genuine understanding. 🌱",
    "Solid work! The concepts are clicking. 🚀",
    "Great job — strong grasp on display! 🌟",
    "Excellent work today! 🧠⚡",
    "Perfect score — outstanding! 🏆"
  ];
  document.getElementById('scoreText').textContent = `You scored ${score} / ${cards.length}`;
  document.getElementById('scoreMsg').textContent = msgs[Math.min(score, msgs.length - 1)];
  banner.classList.add('show');
  renderProgress();
  banner.scrollIntoView({ behavior:'smooth', block:'center' });
}

function renderProgress() {
  const quiz = QUIZZES[activeQuiz], st = S();
  const panel = document.getElementById('progress');
  const bars = document.getElementById('topicBars');
  const note = document.getElementById('focusNote');
  if (!st.totalSeen) { panel.classList.remove('show'); return; }
  bars.innerHTML = '';
  if (quiz.mode === "areas") {
    let weakest = null, weakestPct = 101;
    quiz.order.forEach(area => {
      const t = st.byTier[area];
      const row = document.createElement('div');
      row.className = 'topic-row';
      let pctLabel = "not seen yet", width = 0;
      if (t && t.seen) {
        const pct = Math.round(100 * t.correct / t.seen);
        width = pct; pctLabel = `${t.correct}/${t.seen} · ${pct}%`;
        if (pct <= 50) row.classList.add('weak'); else if (pct >= 80) row.classList.add('strong');
        if (pct < weakestPct) { weakestPct = pct; weakest = area; }
      }
      row.innerHTML = `<span class="topic-name">${quiz.topics[area]}</span><span class="bar"><span style="width:${width}%"></span></span><span class="topic-pct">${pctLabel}</span>`;
      bars.appendChild(row);
    });
    note.style.display = 'block';
    if (weakest !== null && weakestPct <= 70) note.textContent = `🎯 Your next quizzes will lean more on: ${quiz.topics[weakest]}`;
    else note.textContent = `✅ Balanced across topics — keep the streak going! (${st.totalQuizzes} quizzes done)`;
  } else {
    const pct = Math.round(100 * st.totalCorrect / st.totalSeen);
    const row = document.createElement('div');
    row.className = 'topic-row';
    if (pct <= 50) row.classList.add('weak'); else if (pct >= 80) row.classList.add('strong');
    row.innerHTML = `<span class="topic-name">${quiz.topicName}</span><span class="bar"><span style="width:${pct}%"></span></span><span class="topic-pct">${st.totalCorrect}/${st.totalSeen} · ${pct}%</span>`;
    bars.appendChild(row);
    note.style.display = 'block';
    note.textContent = `📚 ${st.totalQuizzes} quizzes done · questions you miss come back more often.`;
  }
  panel.classList.add('show');
}

function resetView() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('quiz').innerHTML = '';
  document.getElementById('actionRow').classList.add('hidden');
  document.getElementById('scoreBanner').classList.remove('show');
  document.getElementById('startBtn').classList.remove('hidden');
  currentQuestions = []; answered = false;
}

function switchTab(id) {
  activeQuiz = id;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.quiz === id));
  document.getElementById('subtitle').textContent = QUIZZES[id].desc;
  resetView();
  renderProgress();
}

/* ---- wiring ---- */
document.getElementById('datePill').textContent =
  new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });

document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.quiz)));

document.getElementById('startBtn').addEventListener('click', () => {
  buildQuiz();
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('actionRow').classList.remove('hidden');
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('scoreBanner').classList.remove('show');
  document.getElementById('quiz').scrollIntoView({ behavior:'smooth', block:'start' });
});
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('newBtn').addEventListener('click', () => {
  document.getElementById('scoreBanner').classList.remove('show');
  buildQuiz();
  window.scrollTo({ top:0, behavior:'smooth' });
});
document.getElementById('resetLink').addEventListener('click', () => {
  if (confirm(`Reset saved progress for the "${activeQuiz}" tab?`)) {
    state[activeQuiz] = blank(); save();
    resetView(); renderProgress();
  }
});

/* init */
document.getElementById('subtitle').textContent = QUIZZES[activeQuiz].desc;
renderProgress();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
