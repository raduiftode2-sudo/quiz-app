<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>AI/ML Brain Warm-Up</title>

<!-- PWA / iOS "Add to Home Screen" -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI Quiz">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --card-soft: #f1f3f6;
    --accent: #4f46e5;
    --accent-soft: #6366f1;
    --accent-tint: #eef0fe;
    --text: #1f2937;
    --muted: #6b7280;
    --correct: #16a34a;
    --correct-bg: #ecfdf3;
    --correct-border: #86efac;
    --wrong: #dc2626;
    --wrong-bg: #fef2f2;
    --wrong-border: #fca5a5;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: contain; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding:
      calc(40px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(60px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.02em; font-weight: 700; }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin: 0; }
  .date-pill {
    display: inline-block; margin-top: 14px; padding: 5px 15px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    font-size: 0.8rem; color: var(--accent); font-weight: 600;
  }

  #progress {
    display: none; margin: 22px 0 4px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px;
  }
  #progress.show { display: block; }
  #progress h3 { margin: 0 0 12px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .topic-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 0.85rem; }
  .topic-row:last-child { margin-bottom: 0; }
  .topic-name { width: 120px; flex-shrink: 0; color: var(--text); font-weight: 500; }
  .bar { flex: 1; height: 8px; background: var(--card-soft); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
  .topic-pct { width: 76px; flex-shrink: 0; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
  .topic-row.weak .bar > span { background: var(--wrong); }
  .topic-row.strong .bar > span { background: var(--correct); }
  .focus-note { margin-top: 12px; font-size: 0.83rem; color: var(--accent); background: var(--accent-tint); padding: 9px 12px; border-radius: 9px; }

  .controls { text-align: center; margin: 22px 0 28px; }
  button.primary {
    background: var(--accent); color: #fff; border: none; padding: 14px 28px; font-size: 1rem;
    font-weight: 600; border-radius: 12px; cursor: pointer; transition: background .14s ease, transform .12s ease;
  }
  button.primary:active { transform: scale(0.98); background: var(--accent-soft); }
  button.ghost {
    background: var(--card); color: var(--accent); border: 1px solid var(--border);
    padding: 12px 22px; font-size: 0.94rem; font-weight: 600; border-radius: 11px; cursor: pointer; margin: 6px 5px 0;
  }
  button.ghost:active { background: var(--card-soft); }

  .q-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 18px 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .q-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px; }
  .q-num {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent-tint); color: var(--accent); font-weight: 700; font-size: 0.86rem;
    display: flex; align-items: center; justify-content: center;
  }
  .q-text { font-size: 1.02rem; font-weight: 600; color: var(--text); }
  .q-tag {
    font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); font-weight: 700; margin-left: auto; white-space: nowrap;
    background: var(--card-soft); padding: 3px 8px; border-radius: 6px;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  label.opt {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 11px;
    cursor: pointer; transition: border-color .12s ease, background .12s ease;
  }
  label.opt:active { background: var(--accent-tint); }
  label.opt input { accent-color: var(--accent); width: 19px; height: 19px; flex-shrink: 0; }
  .opt-letter { font-weight: 700; color: var(--accent); width: 16px; flex-shrink: 0; text-align: center; }
  label.opt.correct { background: var(--correct-bg); border-color: var(--correct-border); }
  label.opt.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
  label.opt.locked { cursor: default; }
  label.opt.idk { border-style: dashed; color: var(--muted); margin-top: 2px; }
  label.opt.idk .opt-letter { filter: grayscale(0.2); }

  .feedback {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem;
    display: none; background: var(--card-soft); border-left: 3px solid var(--accent);
  }
  .feedback.show { display: block; }
  .feedback .verdict { font-weight: 700; }
  .feedback .verdict.right { color: var(--correct); }
  .feedback .verdict.miss { color: var(--wrong); }
  .feedback .verdict.idk { color: var(--accent); }
  .feedback .ans { color: var(--accent); font-weight: 600; display: block; margin-top: 6px; }
  .feedback .learn {
    display: inline-block; margin-top: 9px; color: var(--accent); font-weight: 600;
    text-decoration: none; font-size: 0.88rem; border-bottom: 1px solid var(--accent-soft); padding-bottom: 1px;
  }
  .feedback .learn:active { opacity: 0.7; }

  #scoreBanner {
    display: none; text-align: center; margin: 24px 0; padding: 22px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  #scoreBanner.show { display: block; }
  #scoreBanner .score { font-size: 1.9rem; font-weight: 800; color: var(--accent); }
  #scoreBanner .msg { color: var(--muted); margin-top: 4px; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 30px; }
  footer a { color: var(--accent); cursor: pointer; text-decoration: none; }

  @media (max-width: 600px) {
    h1 { font-size: 1.45rem; }
    .q-card { padding: 18px 15px 14px; }
    #actionRow.sticky {
      position: sticky; bottom: 0; margin: 8px -8px 0; padding: 12px 8px calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 70%, rgba(246,247,249,0));
    }
    #actionRow.sticky button.primary { width: 100%; }
    #actionRow.sticky button.ghost { width: 100%; margin: 8px 0 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧠 Daily Machine Learning Warm-Up</h1>
    <p class="subtitle">Five friendly questions, easy to hard. No stress — pick "I don't know" any time.</p>
    <div class="date-pill" id="datePill"></div>
  </header>

  <div id="progress">
    <h3>Your progress so far</h3>
    <div id="topicBars"></div>
    <div class="focus-note" id="focusNote"></div>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">Start today's quiz →</button>
  </div>

  <div id="scoreBanner">
    <div class="score" id="scoreText"></div>
    <div class="msg" id="scoreMsg"></div>
  </div>

  <form id="quiz" class="hidden"></form>

  <div class="controls hidden sticky" id="actionRow">
    <button type="button" class="primary" id="submitBtn">Submit answers</button>
    <button type="button" class="ghost" id="newBtn">New questions</button>
  </div>

  <footer>
    Your results are saved privately on this device only.
    <a id="resetLink">Reset my progress</a>
  </footer>
</div>

<script>
/* ============================================================
   QUESTION BANK — practical ML, tiers 1 (easy) .. 5 (hard).
   Each question: id, q, o (4 options), a (correct index 0-3),
   e (plain-language explanation), link (where to learn more).
   ============================================================ */
const BANK = {
  1: [
    { id:"e1", q:"In simple terms, what is machine learning?",
      o:["A computer that learns patterns from examples, instead of being told every rule","A faster type of calculator","A way to store files in the cloud","A programming language"],
      a:0, e:"Machine learning means a program improves at a task by finding patterns in data (examples), rather than a human writing out every rule by hand.",
      link:"https://en.wikipedia.org/wiki/Machine_learning" },
    { id:"e2", q:"In supervised learning, what is a 'label'?",
      o:["The name of the software","The correct answer for a training example","The speed of the computer","The colour of a chart"],
      a:1, e:"A label is the known correct answer attached to an example — like tagging a photo 'cat'. The model learns to predict labels for new, unlabelled data.",
      link:"https://en.wikipedia.org/wiki/Supervised_learning" },
    { id:"e3", q:"Which of these is a classification task?",
      o:["Predicting next month's exact sales in euros","Deciding whether an email is spam or not spam","Estimating a person's exact height","Forecasting tomorrow's temperature"],
      a:1, e:"Classification sorts things into categories (spam / not spam). Predicting an exact number instead is called regression.",
      link:"https://en.wikipedia.org/wiki/Statistical_classification" },
    { id:"e4", q:"What is a 'feature' in machine learning?",
      o:["A bug in the program","A piece of input information used to make a prediction","The final score","A type of chart"],
      a:1, e:"Features are the input details the model looks at — e.g. a customer's age, income, and location when predicting loan risk.",
      link:"https://en.wikipedia.org/wiki/Feature_(machine_learning)" },
    { id:"e5", q:"What is the 'training data' used for?",
      o:["Showing the model examples so it can learn","Cooling down the computer","Storing passwords","Drawing the final graph"],
      a:0, e:"Training data is the set of examples the model learns from. Its performance is then judged on separate data it hasn't seen.",
      link:"https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets" },
    { id:"e6", q:"In machine learning, what is a 'model'?",
      o:["A fashion term","The learned system that turns inputs into predictions","The keyboard","A backup copy of your files"],
      a:1, e:"A model is the result of training — the thing that takes new inputs (features) and produces a prediction or decision.",
      link:"https://developers.google.com/machine-learning/glossary#model" },
  ],
  2: [
    { id:"m1", q:"What does 'overfitting' mean?",
      o:["The model is too small to be useful","The model memorises the training examples but does poorly on new data","The model runs too fast","The data file is too big"],
      a:1, e:"An overfit model has basically memorised the training data — including its quirks — so it struggles with new, real-world data.",
      link:"https://en.wikipedia.org/wiki/Overfitting" },
    { id:"m2", q:"Why do we keep a separate 'test set'?",
      o:["To make training faster","To fairly check how the model does on data it has never seen","To save disk space","To make nicer charts"],
      a:1, e:"Testing on held-out data the model never trained on gives an honest estimate of how it will perform in the real world.",
      link:"https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets" },
    { id:"m3", q:"What does 'accuracy' measure?",
      o:["How fast the model runs","The share of predictions the model got right","How much memory is used","The number of features"],
      a:1, e:"Accuracy is the fraction of predictions that were correct. Handy, but it can be misleading when one category is much rarer than another.",
      link:"https://en.wikipedia.org/wiki/Accuracy_and_precision" },
    { id:"m4", q:"What does it mean to 'train' a model?",
      o:["To physically exercise the computer","To adjust the model using examples so its predictions improve","To delete old data","To print a report"],
      a:1, e:"Training repeatedly shows the model examples and tweaks its internal settings to reduce its mistakes.",
      link:"https://en.wikipedia.org/wiki/Machine_learning" },
    { id:"m5", q:"What is a 'hyperparameter'?",
      o:["A setting you choose before training (e.g. how fast the model learns)","A type of computer chip","The final accuracy","A kind of database"],
      a:0, e:"Hyperparameters are knobs set before training — like learning speed or model size — that shape how learning happens.",
      link:"https://en.wikipedia.org/wiki/Hyperparameter_(machine_learning)" },
    { id:"m6", q:"What is a neural network, roughly?",
      o:["A social network for scientists","Layers of simple connected units that learn patterns together","A type of spreadsheet","A way to back up data"],
      a:1, e:"A neural network is layers of simple 'neurons' connected by weighted links; together they can learn surprisingly complex patterns.",
      link:"https://en.wikipedia.org/wiki/Neural_network_(machine_learning)" },
  ],
  3: [
    { id:"h1", q:"What is 'gradient descent', in plain terms?",
      o:["A way to delete bad data","A method that nudges the model step by step to reduce its error","A chart type","A way to speed up the internet"],
      a:1, e:"Imagine walking downhill to the lowest point: gradient descent repeatedly adjusts the model a little in the direction that lowers its error.",
      link:"https://en.wikipedia.org/wiki/Gradient_descent" },
    { id:"h2", q:"What does a 'loss function' do?",
      o:["Measures how wrong the model's predictions are","Counts the rows of data","Picks the chart colours","Saves the file"],
      a:0, e:"The loss is a score for how far off the predictions are. Training tries to make this number as small as possible.",
      link:"https://en.wikipedia.org/wiki/Loss_function" },
    { id:"h3", q:"Which helps prevent overfitting?",
      o:["Using more / more varied training data, or a simpler model","Training for far longer on the same tiny dataset","Removing the test set","Making the model as complex as possible"],
      a:0, e:"More varied data, simpler models, and techniques like regularization all help a model generalise instead of memorising.",
      link:"https://en.wikipedia.org/wiki/Regularization_(mathematics)" },
    { id:"h4", q:"What's the difference between precision and recall?",
      o:["They mean exactly the same thing","Precision = how many flagged items were right; recall = how many of the real ones we caught","Precision is for images, recall is for text","Both measure speed"],
      a:1, e:"Precision asks 'of the things we flagged, how many were correct?'. Recall asks 'of all the real positives, how many did we find?'. There's usually a trade-off.",
      link:"https://en.wikipedia.org/wiki/Precision_and_recall" },
    { id:"h5", q:"What is cross-validation used for?",
      o:["Encrypting the data","Getting a more reliable performance estimate by testing on several data splits","Making the model bigger","Translating the data"],
      a:1, e:"Cross-validation rotates which slice of data is held out for testing, so your performance estimate doesn't depend on one lucky split.",
      link:"https://en.wikipedia.org/wiki/Cross-validation_(statistics)" },
    { id:"h6", q:"A model that is too simple to capture the pattern is said to be…",
      o:["Overfitting","Underfitting","Encrypted","Overclocked"],
      a:1, e:"Underfitting means the model is too basic and misses real structure in the data. Overfitting is the opposite — too tailored to the training set.",
      link:"https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff" },
  ],
  4: [
    { id:"a1", q:"What does a 'confusion matrix' show?",
      o:["How confused the user is","A table of correct vs incorrect predictions for each category","The training speed","The size of the model"],
      a:1, e:"A confusion matrix lays out true positives, false positives, true negatives and false negatives — a clear picture of what kinds of mistakes a model makes.",
      link:"https://en.wikipedia.org/wiki/Confusion_matrix" },
    { id:"a2", q:"What is 'data leakage'?",
      o:["When data is stolen by hackers","When the model accidentally sees test/future info during training, giving falsely great results","When a file gets corrupted","When the GPU overheats"],
      a:1, e:"Leakage is when information that wouldn't really be available at prediction time sneaks into training — so the model looks great in testing but fails in real use.",
      link:"https://en.wikipedia.org/wiki/Leakage_(machine_learning)" },
    { id:"a3", q:"Why is it often useful to scale or normalise features?",
      o:["To make the file smaller","So features on very different ranges (e.g. age vs income) are treated fairly","To change the colours","To delete duplicates"],
      a:1, e:"If one feature ranges 0–1 and another 0–100,000, the big one can dominate. Scaling puts them on comparable footing so the model learns better.",
      link:"https://en.wikipedia.org/wiki/Feature_scaling" },
    { id:"a4", q:"Why can 'imbalanced data' be a problem?",
      o:["It can't be — more of one class is always good","If 99% of cases are one class, a lazy model can score 99% by ignoring the rare class","It makes charts ugly","It uses too much memory"],
      a:1, e:"With rare positives (like fraud), a model predicting 'never fraud' looks 99% accurate yet is useless. You need metrics and methods that focus on the rare class.",
      link:"https://en.wikipedia.org/wiki/Oversampling_and_undersampling_in_data_analysis" },
    { id:"a5", q:"Modern chat assistants (like ChatGPT) are mostly built on which kind of model?",
      o:["Spreadsheets","Transformers (a neural-network design good at language)","Decision trees only","Simple keyword search"],
      a:1, e:"Transformers are a neural-network architecture that handles language and context very well — the foundation of today's large language models.",
      link:"https://jalammar.github.io/illustrated-transformer/" },
    { id:"a6", q:"What is a validation set (vs the test set) mainly for?",
      o:["Final reporting only","Tuning choices like settings and stopping point during development","Training the core model","Storing backups"],
      a:1, e:"You use the validation set to make decisions while building (which settings, when to stop). The test set stays untouched for one final, honest check.",
      link:"https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets" },
  ],
  5: [
    { id:"x1", q:"A model scores great in testing but fails in production. A common cause is…",
      o:["The computer is too fast","The real-world data has drifted/differs from the training data (or there was leakage)","Too many charts","The model file is too small"],
      a:1, e:"Real-world inputs change over time (concept drift) or differ from training data, so offline scores overstate live performance. Monitor and refresh models.",
      link:"https://en.wikipedia.org/wiki/Concept_drift" },
    { id:"x2", q:"The 'bias–variance trade-off' is about balancing…",
      o:["Speed vs memory","A model too simple (misses patterns) vs too complex (chases noise)","Light vs dark mode","Cloud vs local storage"],
      a:1, e:"Too-simple models underfit (high bias); too-complex ones overfit (high variance). Good models strike a balance that generalises well.",
      link:"https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff" },
    { id:"x3", q:"What is an 'ensemble' method?",
      o:["Running the model on many computers","Combining several models so their pooled answer beats any single one","A way to compress data","A type of database index"],
      a:1, e:"Ensembles (like random forests or boosting) blend multiple models; their combined prediction is usually more accurate and stable than one model alone.",
      link:"https://en.wikipedia.org/wiki/Ensemble_learning" },
    { id:"x4", q:"What is 'regularization' for?",
      o:["Making the model train faster","Discouraging overly complex models so they generalise better","Cleaning up text","Encrypting predictions"],
      a:1, e:"Regularization adds a penalty for complexity, nudging the model to stay simpler and avoid overfitting to training-data noise.",
      link:"https://en.wikipedia.org/wiki/Regularization_(mathematics)" },
    { id:"x5", q:"Why might 'representative' training data matter for fairness?",
      o:["It doesn't — any data works equally well","If a group is under-represented or the data is biased, the model can be unfair or inaccurate for them","It only affects file size","It just changes the colours"],
      a:1, e:"Models learn from the data they're given. Biased or unrepresentative data leads to biased predictions — a key concern for lending, hiring and more.",
      link:"https://en.wikipedia.org/wiki/Sampling_bias" },
    { id:"x6", q:"What does the ROC / AUC score help you judge?",
      o:["How fast the model runs","How well a classifier separates the two classes across different thresholds","How big the dataset is","The colour palette"],
      a:1, e:"ROC plots true-positive vs false-positive rates at many thresholds; AUC summarises it in one number (1 = perfect, 0.5 = random guessing).",
      link:"https://en.wikipedia.org/wiki/Receiver_operating_characteristic" },
  ],
  gov: [
    { id:"g1", q:"Under the EU AI Act, AI used to score consumers' creditworthiness is generally treated as…",
      o:["Banned completely","'High-risk' — so it must meet strict rules (oversight, documentation, fairness)","No-risk, nothing required","Exempt because banks are already regulated"],
      a:1, e:"The EU AI Act lists consumer credit-scoring as 'high-risk', meaning banks must ensure risk management, good data, human oversight and documentation.",
      link:"https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai" },
    { id:"g2", q:"For AI in bank lending decisions, EU supervisors most emphasise…",
      o:["Maximum complexity, accuracy above all","Explainability and human oversight, so decisions can be understood and challenged","Keeping models secret from auditors","Skipping documentation to move fast"],
      a:1, e:"Regulators stress that AI affecting customers must be explainable and overseen by people, so decisions can be justified and contested.",
      link:"https://www.eba.europa.eu/" },
    { id:"g3", q:"Under GDPR, a customer rejected for a loan by a purely automated system has the right to…",
      o:["Nothing — it's final","Ask for human review, give their view, and contest the decision (Article 22)","Demand other customers' data","Get the full source code"],
      a:1, e:"GDPR Article 22 protects people from solely automated decisions with major effects, giving rights to human intervention and to challenge the outcome.",
      link:"https://gdpr-info.eu/art-22-gdpr/" },
    { id:"g4", q:"In good model-risk governance at a bank, who should validate a model?",
      o:["The same team that built it","An independent team, separate from the developers, to give honest challenge","The marketing department","Only an outside auditor, once every five years"],
      a:1, e:"Sound practice (and ECB expectations) requires independent validation — people separate from the builders — to challenge the model objectively.",
      link:"https://en.wikipedia.org/wiki/Model_risk" },
    { id:"g5", q:"Which best describes the EU approach to bias in AI lending models?",
      o:["Fairness is optional","Banks must check for and reduce biased outcomes against protected groups","Only internal style guides apply","It's covered by cookie-consent rules"],
      a:1, e:"The AI Act's data-quality duties plus EU anti-discrimination law require banks to test for and mitigate biased, unfair lending outcomes.",
      link:"https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai" },
    { id:"g6", q:"What does 'human-in-the-loop' oversight mean for a high-risk credit model?",
      o:["A person writes every decision by hand","A qualified person can review and override the model's output before it takes effect","No humans are involved at all","Customers vote on each decision"],
      a:1, e:"Human-in-the-loop means a competent person meaningfully reviews and can overturn the AI's output — a core EU AI Act safeguard for high-risk uses.",
      link:"https://en.wikipedia.org/wiki/Human-in-the-loop" },
  ]
};

const TAGS = { 1:"Easy", 2:"Warm-up", 3:"Medium", 4:"Applied", 5:"Hard", gov:"EU Governance" };
const TOPIC_NAMES = { 1:"Fundamentals", 2:"ML basics", 3:"Training & metrics", 4:"Applied ML", 5:"Advanced", gov:"EU Governance" };
const TIER_ORDER = [1, 2, 3, 'gov', 5];

const STORE_KEY = "aimlQuizStats_v1";
function loadStats() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (_) { return {}; } }
function saveStats(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (_) {} }
function blankStats() { return { byId:{}, byTier:{}, recent:[], totalQuizzes:0, totalCorrect:0, totalSeen:0 }; }
let stats = Object.assign(blankStats(), loadStats());

function pickAdaptive(tier) {
  const pool = BANK[tier];
  const weights = pool.map(item => {
    const rec = stats.byId[item.id] || { seen:0, correct:0 };
    let w = 1;
    if (rec.seen === 0) { w += 1.4; }
    else { w += (1 - rec.correct / rec.seen) * 3; }
    if (stats.recent.includes(item.id)) w *= 0.15;
    return w;
  });
  const total = weights.reduce((s, w) => s + w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

let currentQuestions = [];
let answered = false;

function buildQuiz() {
  currentQuestions = TIER_ORDER.map(tier => ({ ...pickAdaptive(tier), tier }));
  answered = false;
  render();
}

function render() {
  const form = document.getElementById('quiz');
  form.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  currentQuestions.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.answer = item.a;
    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<div class="q-num">${qi + 1}</div>
      <div class="q-text">${item.q}</div><div class="q-tag">${TAGS[item.tier]}</div>`;
    card.appendChild(head);
    const opts = document.createElement('div');
    opts.className = 'options';
    item.o.forEach((text, oi) => {
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML = `<input type="radio" name="q${qi}" value="${oi}">
        <span class="opt-letter">${letters[oi]}</span><span>${text}</span>`;
      opts.appendChild(label);
    });
    // "I don't know" choice
    const idk = document.createElement('label');
    idk.className = 'opt idk';
    idk.innerHTML = `<input type="radio" name="q${qi}" value="idk">
      <span class="opt-letter">🤷</span><span>I don't know — just show me the answer</span>`;
    opts.appendChild(idk);
    card.appendChild(opts);
    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.innerHTML = `<span class="verdict"></span> <span class="explain"></span>
      <span class="ans"></span><a class="learn" target="_blank" rel="noopener noreferrer"></a>`;
    card.appendChild(fb);
    form.appendChild(card);
  });
}

function submit() {
  if (answered) return;
  const letters = ['A', 'B', 'C', 'D'];
  const cards = document.querySelectorAll('.q-card');
  let score = 0;
  cards.forEach((card, qi) => {
    const item = currentQuestions[qi];
    const correct = parseInt(card.dataset.answer, 10);
    const chosen = card.querySelector(`input[name="q${qi}"]:checked`);
    const val = chosen ? chosen.value : null;
    const labels = card.querySelectorAll('label.opt');
    labels.forEach(l => { l.classList.add('locked'); l.querySelector('input').disabled = true; });
    labels[correct].classList.add('correct');

    const fb = card.querySelector('.feedback');
    const verdict = fb.querySelector('.verdict');
    const explain = fb.querySelector('.explain');
    const ans = fb.querySelector('.ans');
    const learn = fb.querySelector('.learn');

    // Detailed answer + learning link shown for every question
    explain.textContent = item.e;
    ans.textContent = `Correct answer: ${letters[correct]}) ${item.o[correct]}`;
    learn.href = item.link;
    learn.textContent = 'Learn more →';

    const gotIt = val !== null && val !== 'idk' && parseInt(val, 10) === correct;
    if (gotIt) {
      score++;
      verdict.textContent = '✓ Correct!';
      verdict.className = 'verdict right';
    } else if (val === 'idk') {
      verdict.textContent = "🤷 No worries — here's the answer:";
      verdict.className = 'verdict idk';
    } else if (val !== null) {
      labels[parseInt(val, 10)].classList.add('wrong');
      verdict.textContent = '✗ Not quite — ';
      verdict.className = 'verdict miss';
    } else {
      verdict.textContent = '— No answer selected. ';
      verdict.className = 'verdict miss';
    }
    fb.classList.add('show');

    const rec = stats.byId[item.id] || { seen:0, correct:0 };
    rec.seen++; if (gotIt) rec.correct++; stats.byId[item.id] = rec;
    const tRec = stats.byTier[item.tier] || { seen:0, correct:0 };
    tRec.seen++; if (gotIt) tRec.correct++; stats.byTier[item.tier] = tRec;
    stats.recent.unshift(item.id);
  });
  stats.recent = stats.recent.slice(0, 12);
  stats.totalQuizzes++; stats.totalCorrect += score; stats.totalSeen += cards.length;
  saveStats(stats);
  answered = true;

  const banner = document.getElementById('scoreBanner');
  const msgs = [
    "Every answer you read is a win — the explanations are where the learning happens. 💪",
    "Nice start! Tap the 'Learn more' links on anything you'd like to explore. 📈",
    "Good going! You're building real intuition. 🚀",
    "Great job — solid understanding showing! 🌟",
    "Excellent work today! 🧠⚡",
    "Perfect score! Brilliant. 🏆"
  ];
  document.getElementById('scoreText').textContent = `You scored ${score} / 5`;
  document.getElementById('scoreMsg').textContent = msgs[score];
  banner.classList.add('show');
  renderProgress();
  banner.scrollIntoView({ behavior:'smooth', block:'center' });
}

function renderProgress() {
  const panel = document.getElementById('progress');
  const bars = document.getElementById('topicBars');
  if (!stats.totalSeen) { panel.classList.remove('show'); return; }
  bars.innerHTML = '';
  let weakest = null, weakestPct = 101;
  TIER_ORDER.forEach(tier => {
    const t = stats.byTier[tier];
    const row = document.createElement('div');
    row.className = 'topic-row';
    let pctLabel, width = 0;
    if (t && t.seen) {
      const pct = Math.round(100 * t.correct / t.seen);
      width = pct; pctLabel = `${t.correct}/${t.seen} · ${pct}%`;
      if (pct <= 50) row.classList.add('weak'); else if (pct >= 80) row.classList.add('strong');
      if (pct < weakestPct) { weakestPct = pct; weakest = tier; }
    } else { pctLabel = "not seen yet"; }
    row.innerHTML = `<span class="topic-name">${TOPIC_NAMES[tier]}</span>
      <span class="bar"><span style="width:${width}%"></span></span>
      <span class="topic-pct">${pctLabel}</span>`;
    bars.appendChild(row);
  });
  const note = document.getElementById('focusNote');
  note.style.display = 'block';
  if (weakest !== null && weakestPct <= 70) note.textContent = `🎯 Focusing your next quizzes more on: ${TOPIC_NAMES[weakest]}`;
  else note.textContent = `✅ Balanced across topics — keep the streak going! (${stats.totalQuizzes} quizzes done)`;
  panel.classList.add('show');
}

document.getElementById('datePill').textContent =
  new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
renderProgress();

document.getElementById('startBtn').addEventListener('click', () => {
  buildQuiz();
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('actionRow').classList.remove('hidden');
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('scoreBanner').classList.remove('show');
  document.getElementById('quiz').scrollIntoView({ behavior:'smooth', block:'start' });
});
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('newBtn').addEventListener('click', () => {
  document.getElementById('scoreBanner').classList.remove('show');
  buildQuiz();
  window.scrollTo({ top:0, behavior:'smooth' });
});
document.getElementById('resetLink').addEventListener('click', () => {
  if (confirm("Reset all saved progress on this device?")) {
    stats = blankStats(); saveStats(stats);
    renderProgress(); document.getElementById('progress').classList.remove('show');
  }
});

/* register service worker for offline use (ignored when opened as a local file) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
